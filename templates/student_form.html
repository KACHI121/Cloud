{% extends 'base.html' %}
{% block content %}
<div class="form-page"><a class="back" href="{{ url_for('index') }}">← Back to students</a><div class="form-card"><p class="eyebrow">STUDENT RECORD</p><h1>{{ form_title }}</h1><p class="intro">Enter the details below. You can update them later.</p><form method="post"><label>Full name<input required name="name" value="{{ student.name if student else '' }}" placeholder="e.g. Amara Banda"></label><label>Email address<input required type="email" name="email" value="{{ student.email if student else '' }}" placeholder="student@example.com"></label><label>Course<input required name="course" value="{{ student.course if student else '' }}" placeholder="e.g. Computer Science"></label><label>Year of study<select required name="year"><option value="">Select year</option>{% for year in range(1, 7) %}<option value="{{ year }}" {% if student and student.year|int == year %}selected{% endif %}>Year {{ year }}</option>{% endfor %}</select></label><div class="form-actions"><a class="button secondary" href="{{ url_for('index') }}">Cancel</a><button class="button primary" type="submit">{{ 'Save changes' if student else 'Add student' }}</button></div></form></div></div>
{% endblock %}
